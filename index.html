<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Screen Mirror - Alıcı Ekranı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            background-color: #000000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
            color: #fff; 
        }
        
        #setup-container { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #121212; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10; }
        
        #qrcode { 
            background: #ffffff; 
            padding: 16px; 
            border-radius: 12px; 
            margin: 24px 0; 
            width: 232px; 
            height: 232px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #qrcode img, #qrcode canvas { width: 200px !important; height: 200px !important; display: block; }
        
        .title { font-size: 26px; font-weight: 700; color: #1E88E5; }
        .subtitle { font-size: 15px; color: #aaa; margin-top: 8px; }
        .pin-code { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #4CAF50; margin-top: 12px; }
        .error-code { font-size: 13px; color: #ff5252; margin-top: 10px; max-width: 300px; word-wrap: break-word; }
        
        #remoteVideo { 
            width: 100vw; height: 100vh; 
            object-fit: contain; 
            display: none; background: #000000; cursor: pointer; 
        }
        
        #stop-btn { position: fixed; top: 20px; left: 20px; background: rgba(244, 67, 54, 0.9); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; display: none; z-index: 999; backdrop-filter: blur(4px); }
        #stop-btn:hover { background: rgba(211, 47, 47, 1); }

        #unmute-badge {
            display: none; position: fixed; bottom: 30px; right: 30px;
            background: #1E88E5; color: white; padding: 12px 24px;
            border-radius: 30px; font-weight: 600; font-size: 14px;
            box-shadow: 0 4px 15px rgba(30, 136, 229, 0.4); z-index: 999;
            cursor: pointer;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div id="setup-container">
        <div class="title">Fast Screen Mirror</div>
        <div class="subtitle">Mobil uygulamadan QR kodu taratınız</div>
        <div id="qrcode"></div>
        <div id="pin-display" class="pin-code">PIN Oluşturuluyor...</div>
        <div id="error-display" class="error-code"></div>
    </div>

    <video id="remoteVideo" autoplay playsinline muted></video>
    <audio id="remoteAudio" autoplay></audio>
    
    <button id="stop-btn" onclick="stopStream(event)">Yayını Sonlandır</button>
    <div id="unmute-badge" onclick="unmuteAudio(event)">🔊 Sesi Etkinleştirmek İçin Dokunun</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuy2eGCYG-PFg78AbUM0xRsfjQgKiL16U",
            authDomain: "fast-screen-mirror.firebaseapp.com",
            projectId: "fast-screen-mirror",
            storageBucket: "fast-screen-mirror.firebasestorage.app",
            messagingSenderId: "343909100411",
            appId: "1:343909100411:web:897479e9f8f48c7c1bebde",
            measurementId: "G-2TCB607Q45",
        };

        let peerConnection = null;
        let currentPinId = null;
        let db = null;
        let isConnecting = false;
        let pendingCandidates = []; // HATA ÖNLEYİCİ CANDIDATE BEKLEME HAVUZU

        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function generatePin() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = 'FSM-';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function initRoom() {
            if (peerConnection !== null) return;

            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();

                currentPinId = generatePin();
                document.getElementById('pin-display').innerText = currentPinId;

                const qrContainer = document.getElementById("qrcode");
                qrContainer.innerHTML = "";
                setTimeout(() => {
                    new QRCode(qrContainer, {
                        text: currentPinId,
                        width: 200,
                        height: 200,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }, 50);

                peerConnection = new RTCPeerConnection(configuration);

                if ('addTransceiver' in peerConnection) {
                    peerConnection.addTransceiver('video', { direction: 'recvonly' });
                    peerConnection.addTransceiver('audio', { direction: 'recvonly' });
                }

                peerConnection.ontrack = (event) => {
                    console.log("🎥 AKIŞ YAKALANDI (Tür):", event.track.kind);
                    
                    if (event.track.kind === 'video') {
                        const remoteVideo = document.getElementById('remoteVideo');
                        remoteVideo.srcObject = event.streams[0] || new MediaStream([event.track]);
                        remoteVideo.muted = true;
                        
                        document.getElementById('setup-container').style.display = 'none';
                        remoteVideo.style.display = 'block';
                        document.getElementById('stop-btn').style.display = 'block';

                        remoteVideo.play().catch(e => console.warn("Video uyarısı:", e));
                    } 
                    else if (event.track.kind === 'audio') {
                        console.log("🔊 SES İZİ TV İÇİN ALINDI!");
                        const remoteAudio = document.getElementById('remoteAudio');
                        remoteAudio.srcObject = event.streams[0] || new MediaStream([event.track]);
                        
                        remoteAudio.play().then(() => {
                            console.log("✅ Ses TV'den başarıyla çalıyor!");
                        }).catch(e => {
                            console.warn("Tarayıcı otomatik sesi kilitledi, dokunma butonu aktif:", e);
                            document.getElementById('unmute-badge').style.display = 'block';
                        });
                    }
                };

                const roomRef = db.collection('pins').doc(currentPinId);

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        roomRef.collection('calleeCandidates').add(event.candidate.toJSON());
                    }
                };

                roomRef.onSnapshot(async (snapshot) => {
                    if (!snapshot.exists) {
                        if (isConnecting) {
                            stopStream();
                        }
                        return;
                    }

                    const data = snapshot.data();

                    if (data && data.status === 'ended') {
                        stopStream();
                        return;
                    }

                    if (data && data.offer && !peerConnection.currentRemoteDescription) {
                        try {
                            console.log("📥 OFFER Geldi, İşleniyor...");
                            isConnecting = true;
                            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                            
                            // BEKLEYEN ICE ADAYLARINI GÜVENLE EKLE (INVALID STATE HATASINI BİTİRİR)
                            while (pendingCandidates.length > 0) {
                                const candidate = pendingCandidates.shift();
                                await peerConnection.addIceCandidate(candidate);
                            }

                            const answer = await peerConnection.createAnswer();
                            await peerConnection.setLocalDescription(answer);

                            await roomRef.update({
                                answer: { type: answer.type, sdp: answer.sdp },
                                status: 'connected'
                            });
                            console.log("✅ ANSWER Başarıyla Yazıldı!");
                        } catch (err) {
                            console.error("Session hatası:", err);
                        }
                    }
                });

                // ICE CANDIDATE DİNLEYİCİSİ (Sıralama Korumalı)
                roomRef.collection('callerCandidates').onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach(async (change) => {
                        if (change.type === 'added') {
                            const candidateData = change.doc.data();
                            const candidate = new RTCIceCandidate(candidateData);
                            
                            if (peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
                                try {
                                    await peerConnection.addIceCandidate(candidate);
                                } catch(e) {
                                    console.warn("Candidate ekleme uyarısı:", e);
                                }
                            } else {
                                // Offer henüz işlenmediyse adayı havuza at
                                pendingCandidates.push(candidate);
                            }
                        }
                    });
                });

            } catch (error) {
                document.getElementById('pin-display').innerText = "Bağlantı Kurulamadı";
                document.getElementById('error-display').innerText = error.message || error;
            }
        }

        function unmuteAudio(e) {
            if (e) e.stopPropagation();
            const remoteAudio = document.getElementById('remoteAudio');
            remoteAudio.muted = false;
            remoteAudio.play();
            document.getElementById('unmute-badge').style.display = 'none';
        }

        document.addEventListener('click', (e) => {
            if (e.target.id === 'stop-btn') return;
            const remoteVideo = document.getElementById('remoteVideo');
            const remoteAudio = document.getElementById('remoteAudio');
            
            if (remoteVideo.style.display === 'block') {
                remoteAudio.muted = false;
                remoteAudio.play().catch(err => console.log(err));
                document.getElementById('unmute-badge').style.display = 'none';

                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    }
                }
            }
        });

        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) {
                const remoteVideo = document.getElementById('remoteVideo');
                const remoteAudio = document.getElementById('remoteAudio');
                if (remoteVideo.srcObject) remoteVideo.play().catch(()=>{});
                if (remoteAudio.srcObject) remoteAudio.play().catch(()=>{});
            }
        });

        async function stopStream(e) {
            if (e) e.stopPropagation();
            if (peerConnection) {
                try { peerConnection.close(); } catch(err){}
                peerConnection = null;
            }
            if (currentPinId && db) {
                try { 
                    await db.collection('pins').doc(currentPinId).update({ status: 'ended' });
                    await new Promise(r => setTimeout(r, 200));
                    await db.collection('pins').doc(currentPinId).delete(); 
                } catch(err){}
            }
            location.reload();
        }

        window.addEventListener('beforeunload', () => {
            if (currentPinId && db && isConnecting) {
                db.collection('pins').doc(currentPinId).update({ status: 'ended' });
                db.collection('pins').doc(currentPinId).delete();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            initRoom();
        });
    </script>
</body>
</html>
