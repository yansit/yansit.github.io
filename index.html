<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Screen Mirror - Yansıt</title>
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- QR Code Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0d1117; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }
        #qr-container {
            text-align: center; background: #161b22; padding: 40px;
            border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
        }
        #qrcode {
            background: #ffffff; padding: 16px; border-radius: 16px;
            display: inline-block; margin: 20px 0;
        }
        video {
            display: none; width: 100vw; height: 100vh;
            object-fit: contain; background: #000;
        }
        .status { color: #8b949e; font-size: 1.2rem; margin-top: 10px; }
        .title { font-size: 2rem; font-weight: bold; color: #58a6ff; }
    </style>
</head>
<body>

    <!-- QR KOD EKRANI -->
    <div id="qr-container">
        <div class="title">yansit.github.io</div>
        <p class="status">Telefondan QR kodu okutun</p>
        <div id="qrcode"></div>
        <p style="color: #484f58; font-size: 0.9rem;">Fast Screen Mirror</p>
    </div>

    <!-- CANLI VİDEO EKRANI (WebRTC) -->
    <video id="remoteVideo" autoplay playsinline muted></video>

    <script>
        // --- FIREBASE BİLGİLERİ ---
        const firebaseConfig = {
            apiKey: "BURAYA_GOOGLE_SERVICES_JSON_ICINDEKI_CURRENT_KEY_GELECEK", 
            authDomain: "fastscreenmirror-eb369.firebaseapp.com",
            projectId: "fastscreenmirror-eb369",
            storageBucket: "fastscreenmirror-eb369.firebasestorage.app",
            messagingSenderId: "343909100411",
            appId: "1:343909100411:android:1c94630a5ce3802a1bebde"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. RASTGELE EŞSİZ OTURUM KODU ÜRET VE QR ÇİZ
        const sessionId = "FSM-" + Math.random().toString(36).substring(2, 8).toUpperCase();
        new QRCode(document.getElementById("qrcode"), {
            text: sessionId,
            width: 220,
            height: 220
        });

        // 2. WEBRTC ALICI (PEER CONNECTION) AYARLARI
        const peerConnection = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });

        const remoteVideo = document.getElementById('remoteVideo');
        const qrContainer = document.getElementById('qr-container');

        // Telefondan gelen canlı video akışını yakala
        peerConnection.ontrack = (event) => {
            if (event.streams && event.streams[0]) {
                remoteVideo.srcObject = event.streams[0];
                qrContainer.style.display = 'none'; // QR Kodunu gizle
                remoteVideo.style.display = 'block'; // Videoyu tam ekran aç
            }
        };

        // 3. FIREBASE İLE EL SIKIŞMA (SIGNALING)
        const roomRef = db.collection('pins').doc(sessionId);

        // ICE adaylarını Firebase'e gönder
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                roomRef.collection('calleeCandidates').add(event.candidate.toJSON());
            }
        };

        // Telefonun gönderdiği Offer'ı dinle ve Cevap (Answer) ver
        roomRef.onSnapshot(async (snapshot) => {
            if (!snapshot.exists) return;
            const data = snapshot.data();

            if (data && data.offer && !peerConnection.currentRemoteDescription) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                await roomRef.update({
                    answer: { type: answer.type, sdp: answer.sdp }
                });
            }
        });

        // Telefonun ICE adaylarını dinle
        roomRef.collection('callerCandidates').onSnapshot((snapshot) => {
            snapshot.docChanges().forEach(async (change) => {
                if (change.type === 'added') {
                    let data = change.doc.data();
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data));
                }
            });
        });
    </script>
</body>
</html>
