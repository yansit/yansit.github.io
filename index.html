<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Screen Mirror</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            cursor: pointer; /* Tıklanabilir hissi vermek için */
        }
        #qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0d1117;
        }
        #qr-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            background: #161b22;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 800px;
            gap: 40px;
        }
        #qr-box {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
        }
        #info-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 { font-size: 2.5rem; color: #58a6ff; margin-bottom: 12px; }
        p { color: #8b949e; font-size: 1.2rem; line-height: 1.5; }
        .highlight { color: #ffffff; font-weight: bold; }
        
        #remoteVideo {
            display: none;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background-color: #000000;
        }

        /* Mobil veya dar ekranlarda alt alta al */
        @media (max-width: 768px) {
            #qr-card {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div id="qr-container">
        <div id="qr-card">
            <div id="qr-box">
                <div id="qr-code"></div>
            </div>
            <div id="info-box">
                <h1 id="title-text">Fast Screen Mirror</h1>
                <p id="desc-text">Open the app and scan this QR code to start mirroring your screen instantly.</p>
                <p style="margin-top: 20px; font-size: 0.9rem; color: #484f58;" id="hint-text">(Click anywhere to enter full screen)</p>
            </div>
        </div>
    </div>

    <video id="remoteVideo" autoplay playsinline muted></video>

    <script>
        // 1. ÇOKLU DİL (I18N) KONTROLÜ
        const userLang = navigator.language || navigator.userLanguage; 
        if (userLang.startsWith('tr')) {
            document.getElementById('desc-text').innerHTML = "Ekranınızı anında yansıtmak için <span class='highlight'>uygulamayı açın</span> ve bu QR kodu okutun.";
            document.getElementById('hint-text').innerText = "(Tam ekran yapmak için ekrana dokunun)";
        }

        // 2. OTOMATİK TAM EKRAN DİNLEYİCİSİ
        document.body.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Fullscreen engellendi: " + err.message);
                });
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAuy2eGCYG-PFg78AbUM0xRsfjQgKiL16U",
            authDomain: "fast-screen-mirror.firebaseapp.com",
            projectId: "fast-screen-mirror",
            storageBucket: "fast-screen-mirror.firebasestorage.app",
            messagingSenderId: "343909100411",
            appId: "1:343909100411:web:897479e9f8f48c7c1bebde"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function generateSessionId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = 'FSM-';
            for (let i = 0; i < 6; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
            return result;
        }

        const sessionId = generateSessionId();

        new QRCode(document.getElementById("qr-code"), {
            text: sessionId,
            width: 240,
            height: 240,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        let peerConnection = new RTCPeerConnection(servers);
        const remoteVideo = document.getElementById('remoteVideo');
        const qrContainer = document.getElementById('qr-container');

        peerConnection.ontrack = (event) => {
            if (remoteVideo.srcObject !== event.streams[0]) {
                remoteVideo.srcObject = event.streams[0];
                qrContainer.style.display = 'none';
                remoteVideo.style.display = 'block';
                remoteVideo.play().catch(e => console.error("Oynatma hatası:", e));
            }
        };

        const roomRef = db.collection('pins').doc(sessionId);
        const calleeCandidatesCollection = roomRef.collection('calleeCandidates');

        peerConnection.onicecandidate = (event) => {
            if (event.candidate) calleeCandidatesCollection.add(event.candidate.toJSON());
        };

        let isConnected = false;

        roomRef.onSnapshot(async (snapshot) => {
            const data = snapshot.data();
            if (!data || isConnected) return;

            if (data.offer && !peerConnection.currentRemoteDescription) {
                isConnected = true; 
                const rtcSessionDescription = new RTCSessionDescription(data.offer);
                await peerConnection.setRemoteDescription(rtcSessionDescription);

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                await roomRef.update({ answer: { type: answer.type, sdp: answer.sdp } });
            }
        });

        roomRef.collection('callerCandidates').onSnapshot((snapshot) => {
            snapshot.docChanges().forEach((change) => {
                if (change.type === 'added') {
                    peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                }
            });
        });
    </script>
</body>
</html>
