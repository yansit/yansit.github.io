<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Screen Mirror - Akıllı Tahta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background-color: #000; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; color: #fff; }
        #setup-container { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #121212; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #qrcode { background: #fff; padding: 16px; border-radius: 16px; margin: 20px 0; }
        .title { font-size: 28px; font-weight: bold; color: #1E88E5; }
        .subtitle { font-size: 16px; color: #aaa; margin-top: 8px; }
        .pin-code { font-size: 22px; font-weight: bold; letter-spacing: 2px; color: #4CAF50; margin-top: 10px; }
        #remoteVideo { width: 100vw; height: 100vh; object-fit: contain; display: none; background: #000; cursor: pointer; }
        #stop-btn { position: fixed; top: 20px; left: 20px; background: rgba(244, 67, 54, 0.8); color: white; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; display: none; z-index: 999; backdrop-filter: blur(5px); }
        #stop-btn:hover { background: rgba(244, 67, 54, 1); }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div id="setup-container">
        <div class="title">Fast Screen Mirror</div>
        <div class="subtitle">Telefondaki uygulamadan bu QR kodu okutun</div>
        <div id="qrcode"></div>
        <div id="pin-display" class="pin-code">PIN Oluşturuluyor...</div>
    </div>

    <!-- Canlı Video Ekranı -->
    <video id="remoteVideo" autoplay playsinline muted></video>
    <button id="stop-btn" onclick="stopStream(event)">Yayını Kes</button>

    <script>
        // =========================================================================
        // DİKKAT: BURAYI KENDİ GERÇEK FIREBASE WEB PROJE BİLGİLERİNLE DEĞİŞTİR!
        // =========================================================================
        const firebaseConfig = {
            
            apiKey: "AIzaSyAuy2eGCYG-PFg78AbUM0xRsfjQgKiL16U",
            authDomain: "fast-screen-mirror.firebaseapp.com",
            projectId: "fast-screen-mirror",
            storageBucket: "fast-screen-mirror.firebasestorage.app",
            messagingSenderId: "343909100411",
            appId: "1:343909100411:web:897479e9f8f48c7c1bebde",
            measurementId: "G-2TCB607Q45"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let peerConnection = null;
        let currentPinId = null;

        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function generatePin() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = 'FSM-';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function initRoom() {
            currentPinId = generatePin();
            console.log("🌐 Oda Oluşturuldu PIN:", currentPinId);
            document.getElementById('pin-display').innerText = currentPinId;

            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: currentPinId,
                width: 200,
                height: 200
            });

            peerConnection = new RTCPeerConnection(configuration);

            if ('addTransceiver' in peerConnection) {
                peerConnection.addTransceiver('video', { direction: 'recvonly' });
            }

            // GÖRÜNTÜ YAKALAYICI
            peerConnection.ontrack = (event) => {
                console.log("🎥 VİDEO AKIŞI GELDİ!", event);
                const remoteVideo = document.getElementById('remoteVideo');
                
                let stream = (event.streams && event.streams[0]) 
                    ? event.streams[0] 
                    : new MediaStream([event.track]);

                remoteVideo.srcObject = stream;
                document.getElementById('setup-container').style.display = 'none';
                remoteVideo.style.display = 'block';
                document.getElementById('stop-btn').style.display = 'block';

                setTimeout(() => {
                    remoteVideo.play().catch(e => console.error("Video Oynatma Hatası:", e));
                }, 150);
            };

            const roomRef = db.collection('pins').doc(currentPinId);

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log("❄️ Browser ICE Candidate:", event.candidate.candidate);
                    roomRef.collection('calleeCandidates').add(event.candidate.toJSON());
                }
            };

            roomRef.onSnapshot(async (snapshot) => {
                try {
                    const data = snapshot.data();
                    if (data && data.offer && !peerConnection.currentRemoteDescription) {
                        console.log("📥 OFFER Geldi, İşleniyor...");
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);

                        console.log("📤 ANSWER Oluşturuldu, Firestore'a yazılıyor...");
                        await roomRef.update({
                            answer: { type: answer.type, sdp: answer.sdp },
                            status: 'connected'
                        });
                        console.log("✅ ANSWER Başarıyla Yazıldı!");
                    }
                } catch (err) {
                    console.error("❌ Offer-Answer Hatası:", err);
                }
            });

            roomRef.collection('callerCandidates').onSnapshot((snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added') {
                        peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                    }
                });
            });
        }

        // TEK TIKLA TAM EKRAN YAP / TAM EKRANDAN ÇIK
        document.addEventListener('click', (e) => {
            if (e.target.id === 'stop-btn') return;
            const remoteVideo = document.getElementById('remoteVideo');
            
            if (remoteVideo.style.display === 'block') {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
            }
        });

        async function stopStream(e) {
            if (e) e.stopPropagation();
            if (peerConnection) peerConnection.close();
            if (currentPinId) {
                try { await db.collection('pins').doc(currentPinId).delete(); } catch(e){}
            }
            location.reload();
        }

        window.addEventListener('beforeunload', () => {
            if (currentPinId) db.collection('pins').doc(currentPinId).delete();
        });

        initRoom();
    </script>
</body>
</html>
