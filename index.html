<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Screen Mirror</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        
        #qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0d1117;
            cursor: pointer;
        }
        #qr-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #161b22;
            padding: 50px;
            border-radius: 24px;
            border: 1px solid #30363d;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 900px;
        }
        #qr-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            margin: 30px 0;
        }
        
        .url-text { font-size: 4.5rem; color: #58a6ff; font-weight: 900; letter-spacing: 2px; line-height: 1; margin-bottom: 10px;}
        .instruction-text { color: #ffeb3b; font-size: 1.8rem; font-weight: bold; margin-top: 10px; }
        .sub-text { color: #8b949e; font-size: 1.2rem; margin-top: 20px;}

        #remoteVideo {
            display: none;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background-color: #000000;
        }

        #video-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; 
            z-index: 9999;
        }
        
        #stop-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 60px;
            height: 60px;
            background-color: #d32f2f;
            color: white;
            border: 2px solid #ff5252;
            border-radius: 8px; 
            font-size: 28px;
            cursor: pointer;
            pointer-events: auto; 
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.5);
            transition: 0.2s;
        }
        #stop-btn:hover { background-color: #b71c1c; transform: scale(1.05); }

        #fullscreen-hint {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .url-text { font-size: 2.5rem; }
            .instruction-text { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div id="qr-container">
        <div id="qr-card">
            <h1 class="url-text">yansit.github.io</h1>
            <p class="instruction-text">Uygulamaya Qr kodu okutun.</p>
            <div id="qr-box"><div id="qr-code"></div></div>
            <p class="sub-text">(Tam ekran yapmak için ekrana dokunun)</p>
        </div>
    </div>

    <video id="remoteVideo" autoplay playsinline muted></video>
    
    <div id="video-overlay">
        <button id="stop-btn" onclick="stopBroadcast()" title="Yayını Durdur">■</button>
        <div id="fullscreen-hint">Büyütmek veya küçültmek için ekrana tıklayın.</div>
    </div>

    <script>
        // 1. TAM EKRAN AÇ/KAPA (TOGGLE) DİNLEYİCİSİ
        document.body.addEventListener('click', (e) => {
            // Eğer kırmızı kapat butonuna tıklandıysa tam ekran işlemini iptal et
            if (e.target.id === 'stop-btn') return;

            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen().catch(err => console.log(err));
            }
        });

        // 2. YAYINI DURDUR BUTONU
        function stopBroadcast() {
            if(document.fullscreenElement) document.exitFullscreen().catch(e => console.log(e));
            window.location.href = window.location.origin + window.location.pathname;
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAuy2eGCYG-PFg78AbUM0xRsfjQgKiL16U",
            authDomain: "fast-screen-mirror.firebaseapp.com",
            projectId: "fast-screen-mirror",
            storageBucket: "fast-screen-mirror.firebasestorage.app",
            messagingSenderId: "343909100411",
            appId: "1:343909100411:web:897479e9f8f48c7c1bebde"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function generateSessionId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = 'FSM-';
            for (let i = 0; i < 6; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
            return result;
        }

        const sessionId = generateSessionId();

        new QRCode(document.getElementById("qr-code"), {
            text: sessionId,
            width: 250,
            height: 250,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        let peerConnection = new RTCPeerConnection(servers);
        const remoteVideo = document.getElementById('remoteVideo');
        const qrContainer = document.getElementById('qr-container');
        const videoOverlay = document.getElementById('video-overlay');

        peerConnection.ontrack = (event) => {
            if (remoteVideo.srcObject !== event.streams[0]) {
                remoteVideo.srcObject = event.streams[0];
                qrContainer.style.display = 'none';
                remoteVideo.style.display = 'block';
                videoOverlay.style.display = 'block';
                remoteVideo.play().catch(e => console.error(e));
            }
        };

        peerConnection.onconnectionstatechange = () => {
            if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed' || peerConnection.connectionState === 'closed') {
                if(document.fullscreenElement) document.exitFullscreen().catch(e => console.log(e));
                window.location.href = window.location.origin + window.location.pathname;
            }
        };

        const roomRef = db.collection('pins').doc(sessionId);
        const calleeCandidatesCollection = roomRef.collection('calleeCandidates');

        peerConnection.onicecandidate = (event) => {
            if (event.candidate) calleeCandidatesCollection.add(event.candidate.toJSON());
        };

        let isConnected = false;

        roomRef.onSnapshot(async (snapshot) => {
            const data = snapshot.data();
            if (!data || isConnected) return;

            if (data.offer && !peerConnection.currentRemoteDescription) {
                isConnected = true; 
                const rtcSessionDescription = new RTCSessionDescription(data.offer);
                await peerConnection.setRemoteDescription(rtcSessionDescription);

                const answer = await peerConnection.createAnswer();
                
                // 3. GÖRÜNTÜ KALİTESİ ZORLAMASI (SDP BANT GENİŞLİĞİ HACKİ)
                // Kalitenin pikselleşmesini engellemek için WebRTC'ye 8 Mbps limiti zorluyoruz.
                answer.sdp = answer.sdp.replace(/a=mid:video\r\n/g, 'a=mid:video\r\nb=AS:8000\r\n');

                await peerConnection.setLocalDescription(answer);
                await roomRef.update({ answer: { type: answer.type, sdp: answer.sdp } });
            }
        });

        roomRef.collection('callerCandidates').onSnapshot((snapshot) => {
            snapshot.docChanges().forEach((change) => {
                if (change.type === 'added') {
                    peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                }
            });
        });
    </script>
</body>
</html>
