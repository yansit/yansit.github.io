<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Screen Mirror - Akıllı Tahta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background-color: #000; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; color: #fff; }
        
        /* QR Ve Bekleme Ekranı */
        #setup-container { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #121212; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #qrcode { background: #fff; padding: 16px; border-radius: 16px; margin: 20px 0; }
        .title { font-size: 28px; font-weight: bold; color: #1E88E5; }
        .subtitle { font-size: 16px; color: #aaa; margin-top: 8px; }
        .pin-code { font-size: 22px; font-weight: bold; letter-spacing: 2px; color: #4CAF50; margin-top: 10px; }

        /* Video Yayın Ekranı */
        #remoteVideo { width: 100vw; height: 100vh; object-fit: contain; display: none; background: #000; }
        
        /* Durdur Butonu (Sol Üst) */
        #stop-btn { position: fixed; top: 20px; left: 20px; background: rgba(244, 67, 54, 0.8); color: white; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; display: none; z-index: 999; backdrop-filter: blur(5px); }
        #stop-btn:hover { background: rgba(244, 67, 54, 1); }
    </style>

    <!-- Firebase SDK (v8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <!-- QR Kodu Gösterim Alanı -->
    <div id="setup-container">
        <div class="title">Fast Screen Mirror</div>
        <div class="subtitle">Telefondaki uygulamadan bu QR kodu okutun</div>
        <div id="qrcode"></div>
        <div id="pin-display" class="pin-code">PIN Oluşturuluyor...</div>
    </div>

    <!-- Canlı Video Ekranı -->
    <video id="remoteVideo" autoplay playsinline muted></video>
    <button id="stop-btn" onclick="stopStream()">Yayını Kes</button>

    <script>
        // 1. FIREBASE YAPILANDIRMASI (.env verilerinizi buraya ekleyin)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let peerConnection = null;
        let currentPinId = null;

        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // 2. RASTGELE PIN ÜRETİCİ
        function generatePin() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = 'FSM-';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // 3. WEBRTC VE ODA BAŞLATMA
        async function initRoom() {
            currentPinId = generatePin();
            document.getElementById('pin-display').innerText = currentPinId;

            // QR Kod Çiz
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: currentPinId,
                width: 200,
                height: 200
            });

            peerConnection = new RTCPeerConnection(configuration);

            // SİYAH EKRAN KESİN ÇÖZÜMÜ: Video akışı geldiği an oynatmaya zorluyoruz
            peerConnection.ontrack = (event) => {
                const remoteVideo = document.getElementById('remoteVideo');
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    document.getElementById('setup-container').style.display = 'none';
                    remoteVideo.style.display = 'block';
                    document.getElementById('stop-btn').style.display = 'block';
                    
                    remoteVideo.play().catch(e => console.error("Video oynatma hatası:", e));
                }
            };

            const roomRef = db.collection('pins').doc(currentPinId);

            // ICE Candidate Dinleme (Telefon tarafı gonderdikçe alıyoruz)
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    roomRef.collection('calleeCandidates').add(event.candidate.toJSON());
                }
            };

            // Telefomdan OFFER bekleniyor
            roomRef.onSnapshot(async (snapshot) => {
                const data = snapshot.data();
                if (data && data.offer && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);

                    await roomRef.update({
                        answer: { type: answer.type, sdp: answer.sdp },
                        status: 'connected'
                    });
                }
            });

            // Telefonun ICE adaylarını ekle
            roomRef.collection('callerCandidates').onSnapshot((snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added') {
                        peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                    }
                });
            });
        }

        // 4. YAYINI KESME VE TEMİZLİK
        async function stopStream() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (currentPinId) {
                try {
                    await db.collection('pins').doc(currentPinId).delete();
                } catch(e){}
            }
            location.reload();
        }

        window.addEventListener('beforeunload', () => {
            if (currentPinId) db.collection('pins').doc(currentPinId).delete();
        });

        // Sayfa açılınca başlat
        initRoom();
    </script>
</body>
</html>
