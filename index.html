<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Screen Mirror - Akıllı Tahta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            background-color: #000000; 
            font-family: sans-serif; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
            color: #fff; 
        }
        
        #setup-container { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #121212; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10; }
        
        #qrcode { 
            background: #ffffff; 
            padding: 16px; 
            border-radius: 16px; 
            margin: 24px 0; 
            width: 232px; 
            height: 232px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #qrcode img, #qrcode canvas { width: 200px !important; height: 200px !important; display: block; }
        
        .title { font-size: 28px; font-weight: bold; color: #1E88E5; }
        .subtitle { font-size: 16px; color: #aaa; margin-top: 8px; }
        .pin-code { font-size: 22px; font-weight: bold; letter-spacing: 2px; color: #4CAF50; margin-top: 10px; }
        .error-code { font-size: 14px; color: #ff5252; margin-top: 10px; max-width: 300px; word-wrap: break-word; }
        
        /* Ekranın oval köşelerini siyaha gizleyen sinema modu */
        #remoteVideo { 
            width: 100vw; height: 100vh; 
            object-fit: contain; 
            display: none; background: #000000; cursor: pointer; 
        }
        
        #stop-btn { position: fixed; top: 20px; left: 20px; background: rgba(244, 67, 54, 0.85); color: white; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; display: none; z-index: 999; backdrop-filter: blur(5px); }
        #stop-btn:hover { background: rgba(244, 67, 54, 1); }
    </style>

    <!-- Firebase SDK & QRCode JS -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div id="setup-container">
        <div class="title">Fast Screen Mirror</div>
        <div class="subtitle">Telefondaki uygulamadan bu QR kodu okutun</div>
        <div id="qrcode"></div>
        <div id="pin-display" class="pin-code">PIN Oluşturuluyor...</div>
        <div id="error-display" class="error-code"></div>
    </div>

    <!-- Görüntü Ekranı: Sessizden (muted) çıkartıp tarayıcı ses aktarımını açtığımız doğal etiket -->
    <video id="remoteVideo" autoplay playsinline></video>
    
    <button id="stop-btn" onclick="stopStream(event)">Yayını Kes</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuy2eGCYG-PFg78AbUM0xRsfjQgKiL16U",
            authDomain: "fast-screen-mirror.firebaseapp.com",
            projectId: "fast-screen-mirror",
            storageBucket: "fast-screen-mirror.firebasestorage.app",
            messagingSenderId: "343909100411",
            appId: "1:343909100411:web:897479e9f8f48c7c1bebde",
            measurementId: "G-2TCB607Q45",
        };

        let peerConnection = null;
        let currentPinId = null;
        let db = null;
        let isConnecting = false;

        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        function generatePin() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = 'FSM-';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function initRoom() {
            if (peerConnection !== null) return;

            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();

                currentPinId = generatePin();
                console.log("🌐 Oda Oluşturuldu PIN:", currentPinId);
                document.getElementById('pin-display').innerText = currentPinId;

                const qrContainer = document.getElementById("qrcode");
                qrContainer.innerHTML = "";
                setTimeout(() => {
                    new QRCode(qrContainer, {
                        text: currentPinId,
                        width: 200,
                        height: 200,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }, 50);

                peerConnection = new RTCPeerConnection(configuration);

                if ('addTransceiver' in peerConnection) {
                    peerConnection.addTransceiver('video', { direction: 'recvonly' });
                    peerConnection.addTransceiver('audio', { direction: 'recvonly' });
                }

                // ESKİ DOĞAL PROTOKOL: Görüntü veya ses geldiği an doğrudan ekrana yansıt ve kutuyu gizle!
                peerConnection.ontrack = (event) => {
                    console.log("🎥 AKIŞ YAKALANDI!", event.track.kind);
                    const remoteVideo = document.getElementById('remoteVideo');
                    
                    let stream = (event.streams && event.streams[0]) 
                        ? event.streams[0] 
                        : new MediaStream([event.track]);

                    remoteVideo.srcObject = stream;
                    
                    // Bekleme animasyonu yok; QR ekrandan kalkıp yerini videoya bırakır
                    document.getElementById('setup-container').style.display = 'none';
                    remoteVideo.style.display = 'block';
                    document.getElementById('stop-btn').style.display = 'block';

                    // Tarayıcı otomatik sesli oynatmayı engellerse, ekrana ilk dokunuşta sesi aç
                    setTimeout(() => {
                        remoteVideo.muted = false;
                        remoteVideo.play().catch(e => {
                            console.warn("Tarayıcı otomatik sesi kilitledi, ekrana ilk tıklandığında ses açılacak.", e);
                            document.body.addEventListener('click', () => {
                                remoteVideo.muted = false;
                                remoteVideo.play();
                            }, { once: true });
                        });
                    }, 150);
                };

                const roomRef = db.collection('pins').doc(currentPinId);

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        roomRef.collection('calleeCandidates').add(event.candidate.toJSON());
                    }
                };

                roomRef.onSnapshot(async (snapshot) => {
                    if (!snapshot.exists) {
                        if (isConnecting) {
                            console.log("🛑 Aktif oturum silindi, ana ekrana dönülüyor...");
                            stopStream();
                        }
                        return;
                    }

                    const data = snapshot.data();

                    if (data && data.status === 'ended') {
                        console.log("🛑 Yayın telefondan sonlandırıldı. QR ekrana dönülüyor...");
                        stopStream();
                        return;
                    }

                    if (data && data.offer && !peerConnection.currentRemoteDescription) {
                        try {
                            console.log("📥 OFFER Geldi, İşleniyor...");
                            isConnecting = true;
                            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                            const answer = await peerConnection.createAnswer();
                            await peerConnection.setLocalDescription(answer);

                            await roomRef.update({
                                answer: { type: answer.type, sdp: answer.sdp },
                                status: 'connected'
                            });
                            console.log("✅ ANSWER Başarıyla Yazıldı!");
                        } catch (err) {
                            console.error("❌ Offer-Answer Hatası:", err);
                        }
                    }
                });

                roomRef.collection('callerCandidates').onSnapshot((snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                        }
                    });
                });

            } catch (error) {
                console.error("🚨 BAŞLATMA HATASI:", error);
                document.getElementById('pin-display').innerText = "Bağlantı Hatası!";
                document.getElementById('error-display').innerText = error.message || error;
            }
        }

        // EVRENSEL TIKLAMA: Ekranın herhangi bir yerine tıklandığında tam ekran yap ve sesi aç
        document.addEventListener('click', (e) => {
            if (e.target.id === 'stop-btn') return;
            const remoteVideo = document.getElementById('remoteVideo');
            
            if (remoteVideo.style.display === 'block') {
                remoteVideo.muted = false;

                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
            }
        });

        async function stopStream(e) {
            if (e) e.stopPropagation();
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (currentPinId && db) {
                try { 
                    await db.collection('pins').doc(currentPinId).update({ status: 'ended' });
                    await new Promise(r => setTimeout(r, 400));
                    await db.collection('pins').doc(currentPinId).delete(); 
                } catch(err){}
            }
            location.reload();
        }

        window.addEventListener('beforeunload', () => {
            if (currentPinId && db && isConnecting) {
                db.collection('pins').doc(currentPinId).update({ status: 'ended' });
                db.collection('pins').doc(currentPinId).delete();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            initRoom();
        });
    </script>
</body>
</html>
